services:
  dashboard:
    image: ghcr.io/brancuuuu/pricewatch-agent:latest
    build: .
    env_file: .env
    environment:
      PRICEWATCH_DB: /app/data/pricewatch.db
    ports:
      - "8790:8790"
    volumes:
      - ./data:/app/data
    command: ["node", "dist/cli.js", "serve"]

  watcher:
    image: ghcr.io/brancuuuu/pricewatch-agent:latest
    build: .
    env_file: .env
    environment:
      PRICEWATCH_DB: /app/data/pricewatch.db
    volumes:
      - ./data:/app/data
    command: ["node", "dist/cli.js", "watch"]
    restart: unless-stopped
